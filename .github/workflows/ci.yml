name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  build-test:
    runs-on: windows-latest   # WPF project needs Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore SensorAnalysis.sln
      - run: dotnet build SensorAnalysis.sln -c Release --no-restore
      - run: dotnet test SensorAnalysis.sln -c Release --no-build --logger trx
      - name: Smoke CLI
        run: |
          dotnet run --project src/SensorAnalysis.Cli -c Release --no-build -- `
            --trials 2 --ticks 20 --agents 5 --incidents 2 `
            --agent-type RandomWalk --seed 1 --out ./smoke-out
          Test-Path ./smoke-out/metrics.csv
      - name: Build and test Space and Sphere
        run: |
          dotnet test tests/SensorAnalysis.Space.Core.Tests/SensorAnalysis.Space.Core.Tests.csproj -c Release
          dotnet build src/SensorAnalysis.Space.App/SensorAnalysis.Space.App.csproj -c Release
          dotnet test tests/SensorAnalysis.Sphere.Core.Tests/SensorAnalysis.Sphere.Core.Tests.csproj -c Release
          dotnet build src/SensorAnalysis.Sphere.App/SensorAnalysis.Sphere.App.csproj -c Release
